[project]
name = "meli-challenge-llm"
version = "0.1.0"
description = "ETL + RAG over raw Markdown project documentation"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "datasketch>=1.6",
    "sentence-transformers>=5.0",
    "transformers>=4.56",
    "peft>=0.13",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "langchain-chroma>=0.2",
    "langchain-huggingface>=0.1",
]

[project.scripts]
parse-docs = "rag_etl.parse_docs:main"
build-ontology = "rag_etl.ontology:main"

[dependency-groups]
dev = ["pytest>=8.0", "jupyter>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_etl"]
